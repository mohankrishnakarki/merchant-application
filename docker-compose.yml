services:
  postgres:
    container_name: postgres
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports: 
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mongo:
    container_name: mongo
    image: mongo:6
    env_file: .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports: 
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  redis:
    container_name: redis
    image: redis:7-alpine
    env_file: .env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports: 
      - "${REDIS_PORT:-6379}:6379"
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production

    image: merchant-payments-api:latest
    container_name: merchant-payments-api
    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: 3000

      DB_HOST: postgres
      DB_PORT: 5432

      MONGO_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD}@mongodb:27017/merchant_payments?authSource=admin

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    ports:
      - "3000:3000"

    depends_on:
      postgres:
        condition: service_healthy

      mongodb:
        condition: service_healthy

      redis:
        condition: service_healthy


volumes:
  pgdata:
  mongodata: